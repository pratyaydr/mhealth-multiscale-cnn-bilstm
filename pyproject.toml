[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mhealth-har"
version = "0.1.0"
readme = "README.md"
description = "Run-separated wearable activity recognition with multi-scale CNN and BiLSTM"
requires-python = ">=3.11,<3.13"
authors = [{name = "Pratyay Dhar"}]
dependencies = ["numpy>=1.26,<2.4", "pandas>=2.2,<3", "scikit-learn>=1.5,<1.9", "matplotlib>=3.9,<3.11"]

[project.urls]
Repository = "https://github.com/pratyaydr/mhealth-multiscale-cnn-bilstm"
Documentation = "https://github.com/pratyaydr/mhealth-multiscale-cnn-bilstm#readme"
Original-experiment = "https://www.kaggle.com/code/pratyaydhar/notebook2d06429765"

[project.optional-dependencies]
train = ["tensorflow==2.20.0", "keras==3.13.2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<0.18", "nbformat>=5.10,<6", "nbclient>=0.10,<0.12", "nbconvert>=7.16,<8", "ipykernel>=6.29,<8", "jupyterlab>=4,<5"]

[project.scripts]
mhealth-har = "mhealth_har.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["tensorflow: requires the optional TensorFlow dependency"]

[tool.ruff]
line-length = 100
exclude = ["notebooks/original_experiment.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
